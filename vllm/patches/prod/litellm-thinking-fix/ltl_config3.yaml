model_list:
  # F — everything DIRECTLY under litellm_params (candidate fix shape)
  - model_name: probe-direct
    litellm_params:
      model: openai/qwen3.8-27b-fp8
      api_base: http://127.0.0.1:8901/v1
      api_key: sk-dummy
      request_timeout: 30
      temperature: 0.4
      repetition_penalty: 1.15
      top_k: 10
      min_p: 0.05
      presence_penalty: 0.3
      extra_body:
        chat_template_kwargs:
          enable_thinking: true
          preserve_thinking: true
          reasoning_effort: "xhigh"

  # G — the LIVE local-claude-sonnet shape (default_params) for comparison
  - model_name: probe-default
    litellm_params:
      model: openai/qwen3.8-27b-fp8
      api_base: http://127.0.0.1:8901/v1
      api_key: sk-dummy
      request_timeout: 30
      default_params:
        temperature: 0.3
        top_p: 0.85
        top_k: 10
        min_p: 0.05
        presence_penalty: 0.3
        repetition_penalty: 1.15

litellm_settings:
  drop_params: true

general_settings:
  master_key: sk-dummy
