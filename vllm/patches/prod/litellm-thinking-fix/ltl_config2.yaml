model_list:
  # ---- capture variants (point at local capture server) ----
  # A — user's EXACT .bac-latest shape: strings under
  #     default_params.extra_body.chat_template_kwargs
  - model_name: coder-string
    litellm_params:
      model: openai/qwen3.8-27b-fp8
      api_base: http://127.0.0.1:8901/v1
      api_key: sk-dummy
      request_timeout: 30
      default_params:
        temperature: 0.4
        repetition_penalty: 1.15
        extra_body:
          chat_template_kwargs:
            enable_thinking: "True"
            preserve_thinking: "True"
            reasoning_effort: "xhigh"

